<style>
/* 启动屏样式必须内联在 head：保证首帧即可见，避免白屏闪烁 */
#boot {
  position: fixed; inset: 0; z-index: 999;
  background: #F5F7F5; display: flex; align-items: center; justify-content: center;
  transition: opacity .3s ease;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
}
#boot.out { opacity: 0; pointer-events: none; }
.boot-in { text-align: center; padding: 24px; }
.boot-logo {
  width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 17px;
  background: linear-gradient(135deg, #2F6F5E, #3D8C77); color: #fff;
  font-size: 29px; font-weight: 700; line-height: 58px;
  box-shadow: 0 8px 24px rgba(47, 111, 94, .28);
  animation: bp 1.4s ease-in-out infinite;
}
@keyframes bp { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.boot-name { font-size: 17px; font-weight: 680; color: #1E2521; }
.boot-tip { font-size: 11.5px; color: #7C877F; margin-top: 5px; }
.boot-bar { width: 108px; height: 3px; margin: 16px auto 0; border-radius: 3px; background: #E3E8E3; overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: #2F6F5E; animation: bs 1.1s ease-in-out infinite; }
@keyframes bs { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

#boot-fail {
  position: fixed; inset: 0; z-index: 1000; background: #F5F7F5; overflow: auto;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.bf-in { max-width: 560px; margin: 0 auto; padding: 48px 22px; color: #1E2521; }
.bf-ic { width: 46px; height: 46px; border-radius: 50%; background: #C0504D; color: #fff; font-size: 27px; font-weight: 700; text-align: center; line-height: 46px; margin-bottom: 15px; }
.bf-in h2 { font-size: 19px; margin: 0 0 8px; }
.bf-in p { font-size: 13.5px; color: #4C574F; line-height: 1.75; margin: 0 0 15px; }
.bf-in ol { font-size: 13px; color: #4C574F; line-height: 2; padding-left: 21px; margin: 0 0 22px; }
.bf-in code { background: #EFF3EF; color: #1F5C4A; padding: 1.5px 5px; border-radius: 4px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
.bf-in button { padding: 11px 20px; border: 0; border-radius: 10px; background: #2F6F5E; color: #fff; font-size: 14px; font-weight: 620; cursor: pointer; }
@media (prefers-color-scheme: dark) {
  #boot, #boot-fail { background: #12161A; }
  .boot-name, .bf-in h2 { color: #E4EAE7; }
  .boot-tip { color: #8C978F; }
  .boot-bar { background: #2A323A; }
  .boot-bar i { background: #57A88F; }
  .boot-logo { background: linear-gradient(135deg, #2F6F5E, #57A88F); }
  .bf-in p, .bf-in ol { color: #B6C0BA; }
  .bf-in code { background: #22302A; color: #7FD3B2; }
}
</style>
</head>
<body>

<!-- 启动骨架屏：数据加载失败也能看到友好提示，不会白屏 -->
<div id="boot">
  <div class="boot-in">
    <div class="boot-logo">考</div>
    <div class="boot-name">考途</div>
    <div class="boot-tip" id="boot-tip">正在装载题库…</div>
    <div class="boot-bar"><i></i></div>
  </div>
</div>
<div id="boot-fail" hidden>
  <div class="bf-in">
    <div class="bf-ic">!</div>
    <h2>题库加载失败</h2>
    <p id="bf-msg">未能读取本地题库数据。</p>
    <ol>
      <li>确认 <code>data/</code> 目录与 <code>index.html</code> 在同一层。</li>
      <li>若你是从压缩包解压的，请解压<b>整个文件夹</b>后再打开，不要只解压单个文件。</li>
      <li>部分浏览器对本地文件有安全限制，可在项目目录执行
        <code>python -m http.server 8080</code>，再访问 <code>http://localhost:8080</code>。</li>
    </ol>
    <button onclick="location.reload()">重新加载</button>
  </div>
</div>

<div id="app"></div>

<!-- ==================== 数据层（由 tools/build.py 生成，请勿手工编辑） ==================== -->
<!-- QB 引导必须早于所有 data/*.js：它们会调用 window.QB.add / 写入 window.QB.meta -->
<script>
window.QB = window.QB || { packs: {} };
window.QB.add = function (catId, arr) { window.QB.packs[catId] = arr || []; };
</script>
<script src="data/index.js"></script>
<script src="data/q_java.js"></script>
<script src="data/q_jvm.js"></script>
<script src="data/q_concurrent.js"></script>
<script src="data/q_mysql.js"></script>
<script src="data/q_redis.js"></script>
<script src="data/q_spring.js"></script>
<script src="data/q_springboot.js"></script>
<script src="data/q_mybatis.js"></script>
<script src="data/q_mq.js"></script>
<script src="data/q_distributed.js"></script>
<script src="data/q_network.js"></script>
<script src="data/q_os.js"></script>
<script src="data/q_scene.js"></script>
<script src="data/q_math_calc.js"></script>
<script src="data/q_math_linalg.js"></script>
<script src="data/q_math_prob.js"></script>
<script src="data/q_eng_vocab.js"></script>
<script src="data/q_eng_phrase.js"></script>
<script src="data/q_eng_compose.js"></script>
<script src="data/q_eng_read.js"></script>
<script src="data/q_cet6_vocab.js"></script>
<script src="data/q_cet6_listen.js"></script>
<script src="data/q_cet6_read.js"></script>
<script src="data/q_cet6_write.js"></script>
<script src="data/q_cet4_vocab.js"></script>
<script src="data/q_cet4_listen.js"></script>
<script src="data/q_cet4_read.js"></script>
<script src="data/q_cet4_write.js"></script>

<!-- ==================== 应用层 ==================== -->
<script src="js/md.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-core.js"></script>
<script src="js/pages-practice.js"></script>
<script src="js/pages-extra.js"></script>

<script>
(function () {
  'use strict';
  var tip = document.getElementById('boot-tip');
  var boot = document.getElementById('boot');
  var fail = document.getElementById('boot-fail');

  function showFail(msg) {
    if (boot) boot.style.display = 'none';
    if (msg) document.getElementById('bf-msg').textContent = msg;
    if (fail) fail.hidden = false;
  }

  // 依赖自检：任一环节缺失都给明确原因，而不是静默白屏
  try {
    if (!window.QB || !window.QB.meta || !window.QB.meta.categories) {
      throw new Error('data/index.js 未加载：请确认该文件存在，且未被浏览器缓存拦截。');
    }
    if (!window.MD) throw new Error('js/md.js 未加载');
    if (!window.UI) throw new Error('js/ui.js 未加载');
    if (!window.Store) throw new Error('js/store.js 未加载');
    if (!window.App) throw new Error('js/app.js 未加载');
    if (!window.Pages || !window.Pages.home) throw new Error('页面模块未加载（pages-*.js）');

    var total = window.Store.count();
    if (total === 0) {
      showFail('题库为空：data/q_*.js 已加载但不含任何题目。请在项目目录运行 python tools/build.py 重新构建题库。');
      return;
    }

    // 应用启动前把用户字号偏好恢复，避免闪动
    try {
      var s = window.Store.settings();
      if (s && s.font) document.documentElement.style.setProperty('--font-scale', String(s.font));
    } catch (e) { /* 忽略 */ }

    // 先解压加载已下载的在线题库（gzip 存储，异步），再启动渲染，
    // 保证首屏直接是全量题库；无下载记录/解压失败时立即回退内置题库。
    (window.Store.loadRemote ? window.Store.loadRemote() : Promise.resolve(null)).then(function () {
      startBoot();
    }).catch(function () { startBoot(); });

    function startBoot() {
      // 启动（不用 requestAnimationFrame：后台标签页 rAF 会被节流，导致启动屏不消失）
      window.App.boot();
      var shown = window.Store.count();
      if (tip) tip.textContent = '题库 ' + shown + ' 道，准备就绪';
      setTimeout(function () {
        if (boot) boot.classList.add('out');
        setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 340);
        // 开屏后静默检查服务器题库更新（失败会静默用本地数据，不影响使用）
        if (window.Sync && window.Sync.autoSyncOnBoot) window.Sync.autoSyncOnBoot();
      }, 80);
    }

    // 全局错误兜底：单页报错不影响其它页面
    window.addEventListener('error', function (e) {
      console.error('[runtime]', e.message, e.filename, e.lineno);
    });
  } catch (err) {
    console.error(err);
    showFail(String(err && err.message || err));
  }
})();
</script>
</body>
</html>
